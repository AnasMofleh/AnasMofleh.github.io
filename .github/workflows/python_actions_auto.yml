name: update website skills and project auto

on:
  schedule:
    - cron: '0 8 1 * *' # At 08:00 UTC on the 1st of every month

permissions:
  contents: write  # Allows the action to push changes

concurrency:
  group: update-projects-and-skills
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:

      - name: checkout repo content
        uses: actions/checkout@v7 # checkout the repository content to github runner

      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r actions/requirements.txt

      - name: update projects # run projects_getter.py
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python actions/projects_getter.py

      - name: update skills # read images from repo
        run: python actions/skills_reader.py

      - name: commit files
        id: commit
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit"
          else
            git commit -m "chore: update projects and skills data"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: push changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
